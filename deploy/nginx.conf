# Prefer www host. Non-www → www. Add SSL (certbot) in production.
# sudo cp deploy/nginx.conf /etc/nginx/sites-available/goconnectivo
# sudo ln -s /etc/nginx/sites-available/goconnectivo /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx

# Redirect apex → www (HTTP). After TLS, add matching HTTPS server blocks.
server {
    listen 80;
    listen [::]:80;
    server_name goconnectivo.com;
    return 301 https://www.goconnectivo.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.goconnectivo.com;

    client_max_body_size 80m;

    # SEO files should be served by Node with correct Content-Type;
    # keep proxying everything to the app.
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
